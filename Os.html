<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Energy-Efficient OS Scheduling</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-800 p-6">
  <div class="container mx-auto max-w-4xl">
    <h1 class="text-2xl font-bold mb-4 text-center text-white">Energy-Efficient OS Scheduling</h1>
    <div class="bg-gray-400 p-6 rounded-lg shadow-lg border-2 border-gray-600">
      <label class="block font-semibold mb-2">Select Algorithm:</label>
      <select id="algorithm" class="border p-2 rounded w-full mb-4 bg-gray-200">
        <option value="FCFS">FCFS (First-Come, First-Serve)</option>
        <option value="RR">RR (Round Robin)</option>
        <option value="EnergyAware">Energy-Aware Scheduling</option>
      </select>
      <div id="quantum-time-container" class="mt-2 hidden">
        <label class="block font-semibold mb-2">Quantum Time:</label>
        <input type="number" id="quantum-time" class="border p-2 rounded w-full" placeholder="Enter Quantum Time">
      </div>
      <div id="tasks"></div>
      <button onclick="addTask()" class="mt-4 bg-blue-500 text-white px-6 py-2 rounded-full">Add Task</button>
      <button onclick="loadSampleTasks()" class="mt-4 bg-yellow-500 text-white px-6 py-2 rounded-full">Load Sample Tasks</button>
      <button onclick="runScheduling()" class="mt-4 bg-green-500 text-white px-6 py-2 rounded-full">Run Scheduling</button>
    </div>

    <div class="bg-green-200 p-6 rounded-lg shadow-lg mt-6 border-2 border-green-600">
      <h2 class="text-xl font-bold mb-4">Scheduling Results</h2>
      <table class="w-full border-collapse border border-gray-300 text-center">
        <thead>
          <tr class="bg-gray-200">
            <th class="border p-2">Task</th>
            <th class="border p-2">Start</th>
            <th class="border p-2">Finish</th>
            <th class="border p-2">Energy Saved</th>
            <th class="border p-2">Turnaround</th>
            <th class="border p-2">Waiting</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>

    <div class="flex flex-wrap justify-center gap-4 mt-6">
      <div class="bg-white p-4 rounded-lg shadow-lg w-[45%] border-2 border-black">
        <h2 class="text-xl font-bold mb-2 text-center">Energy Savings Chart</h2>
        <p id="energyPercentage" class="text-center font-semibold text-gray-600">Overall Energy Saved: 0%</p>
        <canvas id="energyChart"></canvas>
      </div>
      <div class="bg-white p-4 rounded-lg shadow-lg w-[45%] border-2 border-black">
        <h2 class="text-xl font-bold mb-2 text-center">CPU Usage Over Time ⏳</h2>
        <p id="cpuPercentage" class="text-center font-semibold text-gray-600">Average CPU Usage: 0%</p>
        <canvas id="cpuChart"></canvas>
      </div>
    </div>

    <div class="bg-white mt-6 p-4 rounded-lg border-2 border-black">
      <h2 class="text-xl font-bold mb-2 text-center">Gantt Chart View</h2>
      <canvas id="ganttChart"></canvas>
    </div>
  </div>

  <script>
    document.getElementById("algorithm").addEventListener("change", function () {
      document.getElementById("quantum-time-container").classList.toggle("hidden", this.value !== "RR");
    });

    function addTask() {
      const taskContainer = document.getElementById("tasks");
      const taskElement = document.createElement("div");
      taskElement.classList.add("flex", "space-x-2", "mb-2", "task-row");
      taskElement.innerHTML = `
        <input type="number" placeholder="Arrival Time" class="arrival-time border p-2 rounded w-1/3">
        <input type="number" placeholder="Burst Time" class="burst-time border p-2 rounded w-1/3">
        <input type="number" placeholder="Priority" class="priority border p-2 rounded w-1/3">
        <button onclick="removeTask(this)" class="bg-red-500 text-white px-4 py-1 rounded">Remove</button>
      `;
      taskContainer.appendChild(taskElement);
    }

    function removeTask(button) {
      button.parentElement.remove();
    }

    function loadSampleTasks() {
      const sample = [
        { arrivalTime: 0, burstTime: 5, priority: 3 },
        { arrivalTime: 1, burstTime: 3, priority: 2 },
        { arrivalTime: 2, burstTime: 8, priority: 5 }
      ];
      const taskContainer = document.getElementById("tasks");
      taskContainer.innerHTML = "";
      sample.forEach(task => {
        addTask();
        const rows = document.querySelectorAll(".task-row");
        const row = rows[rows.length - 1];
        row.querySelector(".arrival-time").value = task.arrivalTime;
        row.querySelector(".burst-time").value = task.burstTime;
        row.querySelector(".priority").value = task.priority;
      });
    }

    function runScheduling() {
      const algorithm = document.getElementById("algorithm").value;
      const quantumTime = algorithm === "RR" ? parseInt(document.getElementById("quantum-time").value) : null;
      if (algorithm === "RR" && (!quantumTime || quantumTime <= 0)) {
        alert("Please enter a valid Quantum Time.");
        return;
      }

      const tasks = [];
      document.querySelectorAll(".task-row").forEach((el, i) => {
        const arrivalTime = parseInt(el.querySelector(".arrival-time").value);
        const burstTime = parseInt(el.querySelector(".burst-time").value);
        const priority = parseInt(el.querySelector(".priority").value || 0);
        const cpuFrequencyUsed = priority >= 5 ? 1.0 : priority >= 3 ? 0.7 : 0.5;
        tasks.push({ id: i + 1, arrivalTime, burstTime, remainingTime: burstTime, priority, cpuFrequencyUsed });
      });

      if (tasks.length === 0) return alert("Add at least one task.");

      tasks.sort((a, b) => a.arrivalTime - b.arrivalTime);

      let schedule = [], currentTime = 0, queue = [], timeLabels = [], cpuUsageData = [],
          totalEnergySaved = 0, totalCpuUsage = 0, index = 0,
          totalBurstTime = tasks.reduce((sum, t) => sum + t.burstTime, 0);

      const completion = {};

      while (queue.length > 0 || index < tasks.length) {
        while (index < tasks.length && tasks[index].arrivalTime <= currentTime) {
          queue.push(tasks[index++]);
        }

        if (queue.length === 0) {
          currentTime++;
          continue;
        }

        if (algorithm === "EnergyAware") queue.sort((a, b) => a.cpuFrequencyUsed - b.cpuFrequencyUsed);

        let task = queue.shift();
        let startTime = currentTime;
        let execTime = algorithm === "RR" ? Math.min(quantumTime, task.remainingTime) : task.remainingTime;
        let finishTime = startTime + execTime;

        task.remainingTime -= execTime;

        for (let t = startTime; t < finishTime; t++) {
          timeLabels.push(t);
          cpuUsageData.push(task.cpuFrequencyUsed * 100);
          totalCpuUsage += task.cpuFrequencyUsed * 100;
        }

        totalEnergySaved += execTime * (1.0 - task.cpuFrequencyUsed);
        schedule.push({ task: task.id, start: startTime, finish: finishTime, energySaved: execTime * (1 - task.cpuFrequencyUsed) });
        if (task.remainingTime > 0) queue.push(task);
        else completion[task.id] = finishTime;

        currentTime = finishTime;
      }

      const overallEnergy = (totalEnergySaved / totalBurstTime) * 100;
      const avgCpu = totalCpuUsage / totalBurstTime;

      document.getElementById("energyPercentage").textContent = `Overall Energy Saved: ${overallEnergy.toFixed(2)}%`;
      document.getElementById("cpuPercentage").textContent = `Average CPU Usage: ${avgCpu.toFixed(2)}%`;

      displayResults(schedule, completion, tasks);
      generateCPUChart(timeLabels, cpuUsageData);
      generateGanttChart(schedule);
    }

    function displayResults(schedule, completionTimes, tasks) {
      const table = document.getElementById("results");
      table.innerHTML = "";
      const taskLabels = [], energyData = [];

      schedule.forEach(entry => {
        const task = tasks.find(t => t.id === entry.task);
        const turnaround = completionTimes[task.id] - task.arrivalTime;
        const waiting = turnaround - task.burstTime;
        const row = `<tr>
            <td class="border p-2">T${entry.task}</td>
            <td class="border p-2">${entry.start}</td>
            <td class="border p-2">${entry.finish}</td>
            <td class="border p-2">${entry.energySaved.toFixed(2)}</td>
            <td class="border p-2">${turnaround}</td>
            <td class="border p-2">${waiting}</td>
          </tr>`;
        table.innerHTML += row;
        taskLabels.push(`T${entry.task}`);
        energyData.push(entry.energySaved);
      });

      generateEnergyChart(taskLabels, energyData);
    }

    function generateEnergyChart(labels, data) {
      const ctx = document.getElementById("energyChart").getContext("2d");
      if (window.energyChartInstance) window.energyChartInstance.destroy();
      window.energyChartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "Energy Saved (J)", data, backgroundColor: "rgba(54,162,235,0.5)", borderColor: "rgba(54,162,235,1)", borderWidth: 2 }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });
    }

    function generateCPUChart(labels, data) {
      const ctx = document.getElementById("cpuChart").getContext("2d");
      if (window.cpuChartInstance) window.cpuChartInstance.destroy();
      window.cpuChartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "CPU Usage (%)",
            data,
            backgroundColor: "rgba(255,99,132,0.2)",
            borderColor: "rgba(255,99,132,1)",
            borderWidth: 2,
            fill: true
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: true, suggestedMax: 100 }
          }
        }
      });
    }

    function generateGanttChart(schedule) {
      const ctx = document.getElementById("ganttChart").getContext("2d");
      if (window.ganttChartInstance) window.ganttChartInstance.destroy();
      const labels = Array.from(new Set(schedule.map(s => `T${s.task}`)));
      const datasets = labels.map((label, i) => {
        const data = schedule.filter(s => `T${s.task}` === label).map(s => ({ x: [s.start, s.finish], y: label }));
        return { label, data, backgroundColor: `hsl(${i * 50}, 70%, 60%)` };
      });

      window.ganttChartInstance = new Chart(ctx, {
        type: 'bar',
        data: { datasets },
        options: {
          indexAxis: 'y',
          scales: { x: { beginAtZero: true }, y: { stacked: true } },
          plugins: { legend: { display: false } },
          responsive: true
        }
      });
    }
  </script>
</body>
</html>
